<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          var storedFetch = originalFetch;
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (desc && !desc.set) {
            Object.defineProperty(window, 'fetch', {
              get: function() { return storedFetch; },
              set: function(fn) { storedFetch = fn; },
              configurable: true,
              enumerable: true
            });
          }
        } catch (err) {
          // Ignore if environment forbids redefinition
        }

        // Initialize Day/Dark mode immediately to prevent flash
        try {
          var storedTheme = localStorage.getItem('auropro_theme');
          if (storedTheme === 'dark' || (!storedTheme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          // Ignore storage errors
        }
      })();
    </script>
    <title>AuroPro - Designed for Vendors & Clients</title>
    <meta name="description" content="AuroPro is a premier vendor and client empanelment platform with contingent talent governance, separate vendor and client registration, and sector-specific vetting." />
    <meta property="og:title" content="AuroPro - Designed for Vendors & Clients" />
    <meta property="og:description" content="AuroPro is a premier vendor and client empanelment platform with contingent talent governance, separate vendor and client registration, and sector-specific vetting." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#fafaf8] dark:bg-slate-950 text-slate-800 dark:text-slate-100 antialiased selection:bg-orange-500 selection:text-white font-sans min-h-screen transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
